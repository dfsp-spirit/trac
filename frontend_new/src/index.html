<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Time Diary</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/page.css">
  <link rel="stylesheet" href="styles/topbar.css">
  <link rel="stylesheet" href="styles/panel.css">
  <link rel="stylesheet" href="styles/dialogs.css">
  <link rel="stylesheet" href="styles/stage.css">
  <link rel="stylesheet" href="styles/layout.css">
</head>
<body>
<div class="t-app" id="app">

  <header class="t-topbar" id="topbar">
    <div class="t-topbar__inner">
      <div class="t-topbar__row">
        <button class="t-icon-btn" type="button" popovertarget="menu"
                aria-label="Menu" data-i18n-aria-label="diary.shell.menu">
          <svg class="t-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="t-topbar__title">
          <p class="t-topbar__name" id="app-title" data-i18n="diary.shell.appName">Time diary</p>
        </div>
        <p class="t-topbar__note" id="progress-note" hidden></p>
        <button class="t-btn t-btn--secondary t-btn--sm" type="button" id="submit-btn" hidden>
          <svg class="t-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <span data-i18n="diary.shell.submit">Submit</span>
        </button>
      </div>

      <nav class="t-daynav" aria-label="Day" data-i18n-aria-label="diary.shell.dayNav">
        <a class="t-icon-btn" id="day-prev" href="#" aria-keyshortcuts="PageUp"
           aria-label="Previous day" data-i18n-aria-label="diary.shell.previousDay">
          <svg class="t-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <div class="t-daynav__label">
          <p class="t-daynav__day" id="day-label"></p>
          <p class="t-daynav__meta" id="day-meta"></p>
        </div>
        <a class="t-icon-btn" id="day-next" href="#" aria-keyshortcuts="PageDown"
           aria-label="Next day" data-i18n-aria-label="diary.shell.nextDay">
          <svg class="t-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <!-- Consent, instructions, tasks, thank-you and unavailable render here;
       the diary columns below belong to the diary stage only (D37). -->
  <main class="t-stage" id="stage-host" hidden></main>

  <div class="t-shell">
    <!-- Column 1 (desktop): days, coverage and submission state (D28). -->
    <aside class="t-rail" aria-labelledby="rail-title">
      <h2 class="t-rail__title" id="rail-title" data-i18n="diary.shell.days">Days</h2>
      <ol class="t-rail__list" id="rail-list"></ol>
    </aside>

    <!-- Column 2: the continuous timeline. Day sections are rendered here. -->
    <main class="t-timeline" id="timeline">
      <h1 class="t-vh" data-i18n="diary.shell.appName">Time diary</h1>
      <div id="timeline-notices"></div>
      <div id="days" class="t-timeline__days"></div>
    </main>

    <!-- Column 3 (desktop): the panel host. Filled from the template below. -->
    <section class="t-activity-panel" id="panel-host"></section>
  </div>

  <!-- Desktop only (≥1200px, see layout.css): the deployment's legal pages stay
       reachable without opening the menu, which is where desktop visitors look
       for them. Phones deliberately get no footer - under a week-long timeline it
       would be a misclick target - and use the menu instead. Filled by
       ui/legalLinks.js; empty studies render nothing. -->
  <footer class="t-footer" id="footer" hidden>
    <ul class="t-footer__links" id="footer-links"></ul>
  </footer>

  <button class="t-fab" type="button" id="fab" aria-keyshortcuts="n">
    <svg class="t-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span data-i18n="diary.shell.addActivity">Add activity</span>
  </button>

  <!-- Mobile host for the same activity panel: a modal dialog (D29). -->
  <dialog class="t-modal t-activity-dialog" id="dialog-host"></dialog>

  <div class="t-toast-region" id="toast-region" role="status" aria-live="polite"></div>

  <nav popover id="menu" class="t-drawer" aria-labelledby="menu-title">
    <div class="t-drawer__head">
      <h2 id="menu-title" data-i18n="diary.shell.menuTitle">Menu</h2>
      <button class="t-icon-btn" type="button" popovertarget="menu" popovertargetaction="hide"
              aria-label="Close" data-i18n-aria-label="diary.shell.close">
        <svg class="t-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul class="t-drawer__section" aria-label="Actions" data-i18n-aria-label="diary.shell.menuActions">
      <li><button class="t-drawer__item" type="button" id="menu-shortcuts" aria-keyshortcuts="?"
                  data-i18n="diary.shell.keyboardShortcuts">Keyboard shortcuts</button></li>
      <!-- Skipping ends the study's diary part, so it is only offered when the
           study asks for it (`allow_skip_timeuse`) and never on the phone-only
           surface: the menu is the one place that needs it (D41). -->
      <li id="menu-skip-item" hidden>
        <button class="t-drawer__item" type="button" id="menu-skip"
                data-i18n="diary.skip.menuEntry">Skip the diary…</button>
      </li>
    </ul>
    <!-- Pages the deployment and the study link to (imprint, data protection,
         study information, contact). Filled by ui/legalLinks.js from the study
         config; the whole block stays hidden when nothing is configured, and no
         entry is rendered without a URL (D28: an entry that does nothing is
         worse than no entry). Phones get these only here, never in a footer. -->
    <div id="menu-pages-block" hidden>
      <div class="t-drawer__section" data-i18n="diary.shell.menuPages">Pages</div>
      <ul id="menu-pages"></ul>
    </div>
    <!-- A study that ships one language has nothing to choose: the whole block
         (separator included) appears only when the study offers more than one
         (D40). Filled and unhidden by ui/shellChrome.js. -->
    <div id="menu-language-block" hidden>
      <hr>
      <div class="t-drawer__section">
        <label class="t-label" for="language-select" data-i18n="diary.shell.language">Language</label>
        <select class="t-select t-select--text" id="language-select">
          <option value="de" lang="de">Deutsch</option>
          <option value="en" lang="en">English</option>
          <option value="sv" lang="sv">Svenska</option>
        </select>
      </div>
    </div>
  </nav>

  <!-- One source of truth for the activity panel's markup, cloned into
       #panel-host (desktop) or #dialog-host (mobile) by main.js. -->
  <template id="activity-panel-tpl">
    <div class="t-activity-panel__head" data-slot="head">
      <div class="t-activity-panel__titlebar">
        <button class="t-icon-btn" type="button" data-slot="back" hidden
                aria-label="Back" data-i18n-aria-label="diary.shell.back">
          <svg class="t-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <h2 data-slot="title" data-i18n="diary.shell.activities">Activities</h2>
        <button class="t-icon-btn" type="button" data-slot="close"
                aria-label="Close" data-i18n-aria-label="diary.shell.close">
          <svg class="t-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="t-hint" data-slot="context" hidden></p>
      <div class="t-search" data-slot="search">
        <label class="t-search__field">
          <span class="t-vh" data-i18n="diary.shell.searchActivities">Search activities</span>
          <input class="t-input" type="search" autocomplete="off" aria-keyshortcuts="/"
                 placeholder="Search activities" data-i18n-placeholder="diary.shell.searchActivities">
        </label>
        <button class="t-icon-btn" type="button" data-slot="search-clear" hidden
                aria-label="Clear search" data-i18n-aria-label="diary.shell.clearSearch">
          <svg class="t-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="t-activity-panel__body" data-slot="content"></div>
    <div class="t-activity-panel__foot" data-slot="actions" hidden></div>
  </template>

  <noscript>
    <div class="t-notice t-notice--attention">
      <div class="t-notice__body"><p data-i18n="diary.shell.noScript">This page needs JavaScript to show your diary.</p></div>
    </div>
  </noscript>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>

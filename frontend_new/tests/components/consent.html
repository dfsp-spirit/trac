<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>mount: consent</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Query parameters:
        fail  1 rejects the decision, so the failure notice and the re-enabled
              buttons can be checked.

      `window.__decisions` records the answers: the view must report the
      participant's choice and nothing else.
    -->
    <script type="module">
      import { context, flag, session } from './fixture.js';
      import { renderConsent } from '/src/js/ui/views/consent.js';

      const { root, t } = await context();
      const shouldFail = flag('fail');

      window.__decisions = [];

      renderConsent(root, {
        t,
        session: session({
          study_text_consent:
            '# Fixture: Einwilligung\n\nDies ist ein **Testtext**.\n\n## Kontakt\n\nFixture-Institut',
        }),
        onDecide: async (given) => {
          window.__decisions.push(given);
          await new Promise((resolve) => setTimeout(resolve, 50));
          if (shouldFail) throw new Error('fixture: consent failed');
        },
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>Session ended</title>
  <link rel="shortcut icon" href="favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon/android-chrome-512x512.png">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/timeout.css">
</head>
<body>
<main class="t-timeout">
  <div class="t-timeout__card">
    <p class="t-timeout__brand" data-i18n="diary.shell.appName">Time diary</p>
    <h1 data-i18n="diary.timeout.heading">Your session has ended</h1>
    <p data-i18n="diary.timeout.body" data-timeout-body>You were inactive for a while, so this session was closed for your privacy.</p>
    <p class="t-timeout__hint" data-i18n="diary.timeout.hint">Please open your invitation link again to continue.</p>
  </div>
</main>
<script type="module" src="js/timeout-main.js"></script>
</body>
</html>

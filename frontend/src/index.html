<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="common.loading">Loading...</title>

    <!-- Favicons -->
    <link rel="shortcut icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon/android-chrome-512x512.png">
    <link rel="stylesheet" href="styles/fontawesome/all.min.css">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div id="instructionBanner" class="instruction-banner">
        <div class="banner-content">
            <span class="banner-text">
                <span data-i18n="banner.dayOneInstructions">Instructions: Select activity below, then click on timeline to place, and drag borders to extend. To delete an activity, long-press it on mobile or right-click it on desktop and choose Delete (or press 'd' / DEL on desktop).</span>
            </span>
            <button class="banner-close" type="button" data-i18n-aria-label="buttons.close" aria-label="Close">&times;</button>
        </div>
    </div>
    <main id="mainContent">
    <div class="header-section">
        <div class="controls" style="padding-top: 4px; padding-left: 4px; padding-bottom: 4px; padding-right: 4px;">

        <!-- Cycles through the study's timelines, at every width. The label
             always names the timeline this button switches to, so it doubles as
             the hint that more than one timeline exists - on narrow viewports
             only the active timeline is rendered, and this button is the only
             way to the others. Never disabled: it has to work both ways. -->
        <button class="btn switch-timeline-btn" id="switchTimelineBtn" data-is-active="false" hidden>
            <i class="fas fa-right-left" aria-hidden="true"></i>
            <span id="switchTimelineLabel" data-i18n="buttons.switchTimeline">Switch timeline</span>
        </button>

        <button class="btn remove-last-btn" id="removeLastBtn" data-is-active="false" disabled>
            <i class="fas fa-undo" aria-hidden="true"></i>
            <span data-i18n="buttons.removeLast">Remove Last</span>
        </button>

        <button class="btn clear-timeline-btn" id="clearTimelineBtn" data-is-active="false" disabled>
            <i class="fas fa-trash-alt" aria-hidden="true"></i>
            <span data-i18n="buttons.clearTimeline">Clear timeline</span>
        </button>

        <button class="btn save-day-btn" id="saveDayBtn" data-is-active="false" disabled>
            <i class="fas fa-save" aria-hidden="true"></i>
            <span data-i18n="buttons.saveDay">Save Day</span>
        </button>

        <button class="btn submit-study-btn" id="submitStudyBtn" data-is-active="false" disabled
                data-i18n-title="messages.submitStudyIncompleteHint" title="Complete all days before submitting">
            <i class="fas fa-check-double" aria-hidden="true"></i>
            <span data-i18n="buttons.submitStudy">Submit Study</span>
        </button>

        <!-- Phone-only overflow menu. The actions it holds (Clear timeline,
             Remove Last, Skip time reporting, language) are visible in the
             toolbar or footer on desktop, so the trigger is hidden from
             1440 px up. Each item proxies .click() to the real control, which
             keeps one implementation of every action. -->
        <button class="btn more-menu-btn" id="moreMenuBtn" type="button"
                aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu"
                data-i18n-aria-label="buttons.moreActions" aria-label="More actions">
            <i class="fas fa-ellipsis-vertical" aria-hidden="true"></i>
        </button>
        </div>

        <div class="timeline-header">
            <h1 class="timeline-title">Primary Activity</h1>
            <p class="timeline-description"></p>
        </div>
    </div>

    <div class="timeline-canvas">
        <div class="timelines-wrapper">
            <div class="past-initialized-timelines-wrapper"></div>
            <div class="last-initialized-timeline-wrapper"></div>
        </div>
        <div class="gradient-bar"></div>
    </div>

    <div class="activities-container" id="activitiesContainer">
        <div class="activities-accordion"></div>
    </div>
    </main>

    <!-- Debug overlay element -->
    <div id="debugOverlay" class="debugOverlay"></div>

    <!-- Load i18n (internationalization) module -->
    <script src="js/i18n.js" type="module"></script>

    <!-- Load Bowser and other scripts -->
    <script src="assets/bowser/bundled.js"></script>
    <script src="assets/interactjs/interact.min.js"></script>
    <script src="settings/tud_settings.js"></script>
    <script src="js/maintenance.js" type="module"></script>
    <script src="js/study_config_manager.js" type="module"></script>
    <script src="js/timeline_marker.js" type="module"></script>
    <script src="js/timeline.js" type="module"></script>
    <script src="js/utils.js" type="module"></script>
    <script src="js/autoscroll.js" type="module"></script>
    <script src="js/script.js" type="module"></script>
    <!-- <script src="tests/timeline_test.js" type="module"></script> -->
    <!-- <script type="module">
        import { testTimelineMarkerPositioning } from './tests/timeline_test.js';

        // Run tests after page load
        window.addEventListener('load', () => {
            const testResult = testTimelineMarkerPositioning();
            if (!testResult.success) {
                console.error('Timeline marker positioning test failed:', testResult.errors);
            } else {
                console.log('Timeline marker positioning test passed');
            }
        });
    </script> -->

    <!-- Attribute Tracker Script -->
    <script src="js/attributeTracker.js"></script>

    <!-- Footer with optional actions. It starts hidden and is only revealed by
         ui.js when it actually contains a visible action ("Skip time reporting",
         which studies can disable). An empty footer would otherwise waste a
         full row of vertical space on phones. -->
    <div id="instructionsFooter" class="instructions-footer" hidden>
        <div class="footer-actions-row">
            <button class="btn skip-btn footer-skip-btn" id="skipReportingBtn" data-is-active="true">
                <i class="fas fa-forward" aria-hidden="true"></i>
                <span data-i18n="buttons.skipReporting">Skip time reporting</span>
            </button>
        </div>
    </div>
    <!-- The footer is re-used by js/footer.js, which keeps this colour for the legal links.
         #ccc on the page background was 1.53:1 (axe: color-contrast) - unreadable. -->
    <div id="footer" style="padding: 20px; border-top: 1px solid #ddd; text-align: center; margin-top: 20px; font-size: small; color: #475569;">
        <span id="footer_app_title" data-i18n="footer.title">TRAC</span>
        <span id="footer_app_version" style="margin-left: 4px;"></span>
        <br />
        <span id="footer_backend_status" data-i18n="footer.backend_status_connecting">Connecting to backend...</span>
    </div>
    <script src="js/footer.js"></script>
</body>
</html>

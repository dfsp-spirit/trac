<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>mount: copy day dialog</title>
    <!-- The dialog, the chips and the shortcut buttons are all part of the
         component bundle. -->
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Query parameters:
        custom  the study config defines no day groups, so the shortcut section
                must not appear (the individual chips still work).
        lang    interface language, to check that a group label the study did
                not translate falls back to the study default language.
    -->
    <script type="module">
      import { context } from './fixture.js';
      import { createCopyDayDialog } from '/src/js/ui/copyDayDialog.js';

      const { root, t, tCount } = await context('de');
      const params = new URLSearchParams(window.location.search);
      const custom = params.get('custom') === '1';
      const language = params.get('lang') || 'de';

      const names = custom
        ? ['day_0', 'day_1', 'day_2', 'day_3', 'day_4', 'day_5', 'day_6']
        : ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
      const labels = [
        'Montag',
        'Dienstag',
        'Mittwoch',
        'Donnerstag',
        'Freitag',
        'Samstag',
        'Sonntag',
      ];
      const days = names.map((name, index) => ({
        index,
        name,
        display_name: labels[index],
        display_names: { de: labels[index] },
        has_data: false,
        coverage_minutes: 0,
        meets_requirement: false,
      }));

      // The groups come from the study config, already resolved to indexes by
      // the API. "Weekend" deliberately has no English or Swedish name so the
      // tests can see the fallback to the study default language.
      const dayGroups = custom
        ? []
        : [
            {
              key: 'workdays',
              names: { de: 'Alle Werktage', en: 'All work days' },
              day_indexes: [0, 1, 2, 3, 4],
            },
            { key: 'weekend', names: { de: 'Wochenende' }, day_indexes: [5, 6] },
          ];

      const diary = {
        schema_version: 1,
        study: {
          name_short: 'demo',
          name: 'Demo',
          default_language: 'de',
          day_start_minutes: 0,
          submitted_at: null,
        },
        timeline: { min_coverage: 1440, max_overlap: 2 },
        days,
        day_groups: dayGroups,
        activities: [
          {
            client_uuid: 'monday-activity',
            day_label_index: 0,
            activity_code: 1101,
            activity_name: 'Schlafen',
            category: 'General',
            color: null,
            parent_activity_code: null,
            frequency_key: null,
            start_minutes: 600,
            end_minutes: 660,
          },
        ],
      };

      const dialog = createCopyDayDialog({
        root,
        t,
        tCount,
        getDiary: () => diary,
        getLanguage: () => language,
        getCurrentDay: () => 0,
        onCopy: async () => ({ results: [] }),
        onCopied: () => {},
      });
      dialog.open({ sourceDay: 0 });
    </script>
  </body>
</html>

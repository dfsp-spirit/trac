<!DOCTYPE html>
<html lang="en" data-root-path="{{ request.scope.root_path }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TRAC Admin{% endblock %}</title>
    <link rel="icon" href="{{ request.scope.root_path }}/favicon.ico">
    <link rel="stylesheet" href="{{ request.scope.root_path }}/static/admin.css">
</head>
<body>
    <div class="container">
        {% block nav %}{% endblock %}
        {% block content %}{% endblock %}
    </div>
    <script src="{{ request.scope.root_path }}/static/admin.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

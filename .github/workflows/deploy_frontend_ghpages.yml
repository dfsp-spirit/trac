name: Deploy App to GitHub Pages

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate docs are safe for the Jekyll build
        run: |
          # docs/ is published on gh-pages, where GitHub Pages renders every
          # markdown file with Jekyll. Jekyll runs Liquid over the file before
          # the markdown, so a plain ``{% ... %}`` / ``{{ ... }}`` in a doc (a
          # Jinja snippet, a locale placeholder) either fails the build with
          # "Liquid syntax error: Unknown tag" or silently disappears from the
          # rendered page. Wrap such snippets in {% raw %}...{% endraw %}.
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          raw_block = re.compile(r"\{%\s*raw\s*%\}.*?\{%\s*endraw\s*%\}", re.S)
          liquid = re.compile(r"\{%|\{\{")
          offenders = []
          for path in sorted(pathlib.Path("docs").rglob("*.md")):
              text = raw_block.sub("", path.read_text(encoding="utf-8"))
              for match in liquid.finditer(text):
                  line = text[: match.start()].count("\n") + 1
                  offenders.append(f"{path}:{line}")
          if offenders:
              print(
                  "::error::docs markdown is rendered by Jekyll on gh-pages; "
                  "wrap Liquid-looking snippets in {% raw %}...{% endraw %}: "
                  + ", ".join(offenders)
              )
              sys.exit(1)
          print("docs are safe for the Jekyll build")
          PY

      - name: Deploy to gh-pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Save the app files
          mkdir -p /tmp/app-deploy
          rsync -av --exclude='.git' --exclude='.github' . /tmp/app-deploy/

          # Fetch and checkout gh-pages branch
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true

          # Check if gh-pages exists
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
            # Preserve docs directory if it exists
            if [ -d "docs" ]; then
              cp -r docs /tmp/docs-backup
            fi
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          # Clean up current directory (keep .git and docs)
          find . -maxdepth 1 ! -name '.git' ! -name 'docs' ! -name '.' -exec rm -rf {} \;

          # Copy frontend app files to root
          cp -r /tmp/app-deploy/frontend/src/* .

          # Refresh docs from source branch if present, otherwise keep existing docs from gh-pages.
          if [ -d "/tmp/app-deploy/docs" ]; then
            rm -rf docs
            cp -r /tmp/app-deploy/docs docs
          elif [ -d "/tmp/docs-backup" ]; then
            rm -rf docs
            cp -r /tmp/docs-backup docs
          fi

          # Add and commit changes
          git add .
          git commit -m "Deploy frontend application to GitHub Pages" || echo "No changes to commit"

          # Push to gh-pages branch
          git push origin gh-pages
name: Frontend Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # allow manual triggering

jobs:

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    # Unit tests, the D33 architecture check and the type check over the
    # `// @ts-check` modules. `sh test_frontend.sh` runs all three.
    - name: Run frontend checks
      run: sh test_frontend.sh

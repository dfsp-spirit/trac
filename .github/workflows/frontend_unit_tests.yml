name: Frontend Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # allow manual triggering

jobs:

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci

    # Type-check the files marked with `// @ts-check` (currently 15 of the 17
    # modules under src/js; the two large DOM-heavy files script.js + ui.js are
    # intentionally excluded). Scoped via jsconfig.json.
    - name: Type-check the API boundary
      run: sh test_frontend_typecheck.sh

    # The unit tests use only Node built-ins (node:test, node:assert, fs, ...)
    # and import the pure frontend src modules directly. The runner script wraps
    # `node --test` with the global shim.
    - name: Run frontend unit tests
      run: sh test_frontend_unit.sh

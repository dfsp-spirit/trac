name: Frontend Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # allow manual triggering

jobs:

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci

    # Type-check the files marked with `// @ts-check` (currently the API-boundary
    # consumers + api_types.js). Scoped via jsconfig.json; only @ts-check files
    # are checked, so the large unannotated modules (script.js, ui.js, ...) are
    # intentionally not part of this gate yet.
    - name: Type-check the API boundary
      run: npm run typecheck

    # The unit tests use only Node built-ins (node:test, node:assert, fs, ...)
    # and import the pure frontend src modules directly. The runner script wraps
    # `node --test` with the global shim.
    - name: Run frontend unit tests
      run: sh test_frontend_unit.sh
